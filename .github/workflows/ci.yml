name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m py_compile yt.py

      - name: Offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Check the POSIX launcher is executable
        run: test -x yt

      - name: Help output works
        run: python yt.py -h > /dev/null
